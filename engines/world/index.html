<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PROVADIA — World Spine (proof)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { background:#141210; }
  body {
    background:#141210; color:#F4EFE6; font-family:'Inter',system-ui,sans-serif;
    overflow-x:hidden;
  }
  #stage { position:fixed; inset:0; z-index:0; }
  #stage canvas { display:block; width:100%; height:100%; }
  /* Scroll body: ~700vh drives the journey. */
  #scroll-body { position:relative; z-index:1; height:700vh; pointer-events:none; }
  #fade {
    position:fixed; inset:0; background:#000; z-index:10; pointer-events:none;
    opacity:1; transition:opacity 1.6s ease;
  }
  #fade.gone { opacity:0; }
  #caption {
    position:fixed; left:20px; bottom:20px; z-index:5; pointer-events:none;
    font-family:'Cinzel',serif; font-weight:600; letter-spacing:.14em;
    font-size:clamp(15px,2.4vw,22px); color:#FFEFC1;
    text-shadow:0 2px 14px rgba(0,0,0,.85);
    text-transform:uppercase;
  }
  #caption small {
    display:block; margin-top:4px; font-family:'Inter',sans-serif; font-weight:400;
    letter-spacing:.06em; font-size:11px; color:rgba(244,239,230,.62);
    text-transform:none;
  }
  #hint {
    position:fixed; right:20px; bottom:20px; z-index:5; pointer-events:none;
    font-size:11px; letter-spacing:.08em; color:rgba(244,239,230,.45);
    text-transform:uppercase; text-align:right;
  }
  #err {
    position:fixed; left:50%; top:18px; transform:translateX(-50%); z-index:20;
    background:rgba(60,10,10,.92); color:#ffd9d9; border:1px solid #a33;
    padding:10px 14px; border-radius:8px; font-size:13px; display:none;
    max-width:min(92vw,560px);
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="scroll-body"></div>
<div id="caption">Arrival<small>Provadia — the town of record</small></div>
<div id="hint">Scroll to travel<br>the town</div>
<div id="fade"></div>
<div id="err"></div>

<script type="module">
import * as THREE from '../../lib/three.module.min.js';
import { createWorld } from './engine.js';

const errBox = document.getElementById('err');
function showErr(msg) { errBox.textContent = msg; errBox.style.display = 'block'; }
window.addEventListener('error', (e) => showErr('Error: ' + (e.message || e.type)));

// ---- renderer / scene / camera (the integrator does the same) ----
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); // DPR cap 2
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // lighting law
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141210);
scene.fog = new THREE.FogExp2(0x141210, 0.02);        // lighting law

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0, 10, 48);

// ---- world ----
let world;
try {
  world = createWorld(scene);
} catch (e) {
  showErr('createWorld failed: ' + e.message);
  throw e;
}

// ---- ?shot=<0..1> freezes journey progress for screenshots ----
const params = new URLSearchParams(window.location.search);
const shotRaw = params.get('shot');
const shot = shotRaw === null ? null : parseFloat(shotRaw);
if (shot !== null && !isNaN(shot)) world.setShotMode(shot);

// ---- scroll journey ----
let panelMode = false;
let scrollProgress = 0;
function readScroll() {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  scrollProgress = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
  if (!panelMode && shot === null) world.setJourneyProgress(scrollProgress);
}
window.addEventListener('scroll', readScroll, { passive: true });
readScroll();

// ---- stations / caption ----
const LABELS = {
  arrival: 'Arrival',
  gate: 'The Gate',
  square: 'Coin Square',
  wall: 'The Golden Wall',
  record: 'The Record',
  story: 'The Old Street',
  door: "The Captain's Door",
};
const caption = document.getElementById('caption');
const stationCbs = [];
world.onStation((name) => {
  caption.firstChild.textContent = LABELS[name] || name;
  stationCbs.slice().forEach((cb) => { try { cb(name); } catch (e) {} });
});

// ---- TOWN_API (integrator contract) ----
window.TOWN_API = {
  onStation(cb) { if (typeof cb === 'function') stationCbs.push(cb); },
  getProgress() { return world.getProgress(); },
  setPanelMode(on) {
    panelMode = !!on;
    if (!panelMode) readScroll(); // resume: re-sync to wherever scroll is
  },
};

// ---- resize (must not error at mobile sizes) ----
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h);
});

// ---- loop ----
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  world.update(dt, t);
  world.applyCamera(camera, dt);
  renderer.render(scene, camera);
}
tick();

// Black fade-in at load.
requestAnimationFrame(() => requestAnimationFrame(() => {
  document.getElementById('fade').classList.add('gone');
}));
</script>
</body>
</html>
